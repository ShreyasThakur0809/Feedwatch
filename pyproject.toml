[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedwatch"
version = "0.1.0"
description = "Market data feed liveliness monitor reproducing production market-making bot failure modes"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["feedwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
